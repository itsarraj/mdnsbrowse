[package]
name = "mdnsbrowse"
version = "0.1.0"
edition = "2021"
description = "Browses mDNS/Bonjour services on the local network — a dns-sd/avahi-browse alternative, using a real multicast UDP query"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/mdnsbrowse"
readme = "README.md"
keywords = ["mdns", "bonjour", "zeroconf", "cli", "network"]
categories = ["command-line-utilities"]

[lib]
name = "mdnsbrowse"
path = "src/lib.rs"

[[bin]]
name = "mdnsbrowse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
hickory-proto = "0.24"
